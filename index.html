    <!-- Light-mode ambient particle texture: white bg, near-black dust, very
         understated so it never competes with the hero type or grid. Config
         lives in data-* attributes rather than an inline script tag so every
         script on the page can be deferred and the CSP in vercel.json can
         forbid inline script outright. -->
    <div
      id="ambientBg"
      class="flow-field-bg--ambient"
      aria-hidden="true"
      data-flow-field
      data-color="#111111"
      data-background="#ffffff"
      data-trail-opacity="0.25"
      data-particle-count="380"
      data-speed="0.5"
      data-size="2.6"
    ></div>
